<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Capijuli</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#C9B3EC;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
canvas#c{display:block;position:fixed;left:0;top:0}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:12px;background:rgba(246,239,255,.96);text-align:center;padding:20px;box-sizing:border-box;overflow:auto}
.hide{display:none!important}
h1{font-family:'Press Start 2P',monospace;font-size:30px;margin:6px 0;color:#5B3A8E}
h2{font-size:28px;margin:0;color:#5B3A8E}
.sub{color:#7A63A0;font-size:18px;margin:0 0 4px}
.big{font-size:56px;font-weight:800;color:#8E5CC9;margin:0;line-height:1;font-family:'Press Start 2P',monospace}
.btn{width:min(330px,88vw);padding:11px 16px;border:0;border-radius:18px;font-size:22px;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18);font-family:inherit;text-decoration:none;display:block;box-sizing:border-box}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn small{display:block;font-weight:500;font-size:14px;opacity:.95;margin-top:2px}
.b1{background:#8E5CC9}.b2{background:#E072A4}.b3{background:#5C8FD6}.bw{background:#25D366}.bn{background:#A8998A}
@media (max-height:560px){h1{font-size:22px;margin:2px 0}.btn{padding:9px 14px;font-size:18px}.btn small{font-size:12px}.ov{gap:8px;padding:10px}#mini{display:none}.big{font-size:40px}h2{font-size:22px}}
@media (max-height:720px){#mini{display:none}.btn{padding:9px 14px}}
@media (max-width:360px){h1{font-size:24px}.btn{font-size:19px}}
#snd{position:fixed;right:12px;bottom:12px;z-index:50;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:22px;box-shadow:0 2px 6px rgba(0,0,0,.15);cursor:pointer}
.b4{background:#E8A23A}
#l_pic{font-size:min(120px,22vh);line-height:1.1;margin:0;cursor:pointer}
#l_opts{display:flex;flex-direction:column;gap:12px;align-items:center}
.word{width:min(320px,86vw);padding:12px;border:3px solid #CDB8EE;border-radius:18px;background:#fff;color:#5B3A8E;font-size:min(38px,7vh);font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #CDB8EE}
.word.ok{background:#3DA35D;border-color:#3DA35D;color:#fff;box-shadow:0 4px 0 #2b7a44}
.word.no{background:#eee;border-color:#ddd;color:#aaa;box-shadow:none;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#l_stars{font-size:22px;letter-spacing:2px;min-height:28px}
#l_x{position:fixed;left:12px;top:12px;z-index:5;border:0;background:rgba(255,255,255,.9);border-radius:12px;padding:8px 12px;font-size:16px;font-weight:700;color:#5B3A8E;cursor:pointer}
#pbar{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:8px;align-items:center;z-index:6}
#pbar button{border:0;background:rgba(255,255,255,.92);border-radius:12px;padding:8px 12px;font-size:18px;font-weight:700;color:#5B3A8E;cursor:pointer;font-family:inherit}
#pb_title{flex:1;text-align:center;font-weight:800;color:#5B3A8E;background:rgba(255,255,255,.75);border-radius:12px;padding:8px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.piano #snd,body.piano #mag{display:none}
.b5{background:#2FA89A}
#l_row{display:flex;align-items:center;gap:14px;justify-content:center}
#l_letter{font-size:min(52px,9vh);font-weight:800;color:#8E5CC9;background:#fff;border-radius:18px;padding:2px 18px;border:3px solid #CDB8EE;min-width:70px}
#l_rep{border:0;background:#8E5CC9;color:#fff;font-size:20px;font-weight:800;border-radius:16px;padding:10px 18px;box-shadow:0 4px 0 #6b3fa6;cursor:pointer;font-family:inherit}
.word .f{color:#8E5CC9;font-size:1.15em}
.word .hl{background:#FFE066;border-radius:6px;color:#5B3A8E}
.word.ok .f,.word.no .f{color:inherit}
.word.pulse{animation:pulse 1s infinite;border-color:#FFD23F}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 0 8px #FFE066}}
#fx{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:20;opacity:0;transition:opacity .2s}
#fx.show{opacity:1}#fx.good{background:rgba(61,163,93,.28)}#fx.bad{background:rgba(229,72,77,.25)}
#fx .ic{font-size:150px;animation:pop .5s}#fx .tx{font-size:40px;font-weight:800;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25);animation:pop .5s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.conf{position:fixed;top:-50px;font-size:34px;z-index:21;pointer-events:none;animation:fall 1.6s linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(400deg)}}
#a_slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot{width:min(58px,13vw);height:min(68px,15vw);border-bottom:5px solid #8E5CC9;font-size:min(46px,10vw);font-weight:800;color:#5B3A8E;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.7);border-radius:12px 12px 4px 4px}
.slot.ghost{color:rgba(91,58,142,.22)}.slot.cur{background:#FFF3B0;border-bottom-color:#E8A23A}.slot.done{color:#3DA35D}
#a_tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:420px}
.tile{width:min(64px,15vw);height:min(64px,15vw);border:3px solid #CDB8EE;border-radius:16px;background:#fff;font-size:min(38px,9vw);font-weight:800;color:#5B3A8E;box-shadow:0 4px 0 #CDB8EE;cursor:pointer;font-family:inherit}
.tile.used{visibility:hidden}.tile.no{animation:shake .35s;border-color:#E5484D;color:#E5484D}.tile.pulse{animation:pulse 1s infinite;border-color:#FFD23F}
.b6{background:#C0569A}.b7{background:#3A6FD8}.b8{background:#9C84D1}
#newrec{color:#3DA35D;font-weight:800;font-size:20px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu" class="ov">
  <canvas id="mini" width="320" height="290" style="width:140px;height:127px"></canvas>
  <h1>CapiJuli</h1>

  <p id="ver" style="position:fixed;left:10px;bottom:6px;margin:0;font-size:11px;color:#A898C4"></p>
  <button class="btn b1" onclick="start('torre')">🍊 Torre chill<small>Toca para soltar · Récord: <span id="r_torre">0</span></small></button>

  <button class="btn" style="background:#5B3FA6" onclick="start('magia')">🪄 Juli la Maga<small>Toca con tu varita · Récord: <span id="r_magia">0</span></small></button>
  <button class="btn b5" onclick="start('piano')">🎹 Piano con Capijuli<small>Sigue las teclas de colores · Récord: <span id="r_piano">0</span></small></button>

<div id="leer" class="ov hide">
  <button id="l_x" onclick="toMenu()">← Menú</button>
  <div id="l_stars"></div>
  <p id="l_pic"></p>

</div>

  <p class="sub">Elige una canción</p>
  <div id="p_songs" style="display:flex;flex-direction:column;gap:10px;align-items:center"></div>

  <p class="sub" style="font-size:14px;max-width:330px;margin:0">Toca en tu piano la tecla del color que va bajando cuando llegue a la línea. También puedes tocarla aquí en la pantalla.</p>
  <button class="btn bn" onclick="toMenu()" style="font-size:18px;padding:10px">Menú</button>
</div>
<div id="arma" class="ov hide">
  <button id="l_x2" onclick="toMenu()" style="position:fixed;left:12px;top:12px;z-index:5;border:0;background:rgba(255,255,255,.9);border-radius:12px;padding:8px 12px;font-size:16px;font-weight:700;color:#5B3A8E;cursor:pointer">← Menú</button>
  <div id="a_stars" style="font-size:22px;letter-spacing:2px;min-height:28px"></div>
  <p id="a_pic" style="font-size:min(100px,17vh);line-height:1.1;margin:0;cursor:pointer"></p>
  <button id="a_rep" style="border:0;background:#C0569A;color:#fff;font-size:18px;font-weight:800;border-radius:16px;padding:9px 16px;box-shadow:0 4px 0 #94406f;cursor:pointer;font-family:inherit">🔊 Escuchar</button>
  <div id="a_slots"></div>
  <p class="sub" id="a_hint" style="margin:0"></p>
  <div id="a_tiles"></div>
</div>
<div id="fx"></div>
<div id="pbar" class="hide"><button id="pb_menu">←</button><span id="pb_title"></span><button id="pb_mel">🎵</button><button id="pb_pause">⏸</button></div>

<button id="mag" aria-label="Música mágica" style="position:fixed;right:70px;bottom:12px;z-index:50;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:22px;box-shadow:0 2px 6px rgba(0,0,0,.15);cursor:pointer">🪄</button>
<button id="snd" aria-label="Sonido">🔊</button>

<div id="over" class="ov hide">
  <h2 id="o_msg"></h2>
  <p class="sub" id="o_game"></p>
  <p class="big" id="o_score">0</p>
  <p class="sub">Récord: <b id="o_rec">0</b></p>
  <div id="newrec" class="hide">¡Nuevo récord! 🎉</div>
  <button class="btn b1" id="o_again">Otra vez</button>
  <a class="btn bw" id="o_share" target="_blank" rel="noopener">Retar por WhatsApp</a>
  <button class="btn bn" onclick="toMenu()">Menú</button>
</div>

<script>
const $=id=>document.getElementById(id);
const VERSION='2026-11-12.13';
document.addEventListener('DOMContentLoaded',()=>{const v=document.getElementById('ver');if(v)v.textContent='v '+VERSION;});
async function checkUpdate(){
  if(!/^https?:/.test(location.protocol)||/claude/.test(location.host))return;
  try{const r=await fetch(location.pathname+'?t='+Date.now(),{cache:'no-store'});const t=await r.text();const m=t.match(/const VERSION='([^']+)'/);
    if(m&&m[1]!==VERSION&&!(game&&!game.over))location.replace(location.pathname+'?v='+encodeURIComponent(m[1]));}catch(e){}
}
setTimeout(checkUpdate,1500);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate();});
// Capijuli en pixel art (16 x 24)
const PAL={H:'#3B2416',h:'#6A4630',F:'#C98146',f:'#A0632F',E:'#B06A33',G:'#D9D3E8',L:'#2A2433',N:'#6E4A3C',T:'#FFFFFF',S:'#D2CFD6',s:'#ADAAB5',P:'#8E5CC9',K:'#5A3A26'};
const SPR=[
"....HHHHHHHH....",
"...HHHhHHHHHH...",
"..HHHhHHHHHhHH..",
"..HHHHHHHHHHHH..",
"..HHHHHHHHHHHH..",
"..HHGGGGGGGGHH..",
"..HHLLLGGLLLHH..",
"..HHLLLFFLLLHH..",
"..HHFFFNNFFFHH..",
"..HHFFNNNNFFHH..",
"..HHFFFTTFFFHH..",
"..HHHFFFFFFHHH..",
"..HHHSSSSSSHHH..",
".HHHSSSSSSSSHHH.",
".HHSSPSSSSPSSHH.",
".HHFSSSSPSSSFHH.",
".HHHSSSSSSSSHHH.",
".HHHSPSSSSPSHHH.",
"..HHSSSSSSSSHH..",
"..HhHFFFFFFHhH..",
"....FfFFFFfF....",
".....FF..FF.....",
".....FF..FF.....",
"....KKK..KKK...."];
const sprite=document.createElement('canvas');sprite.width=16;sprite.height=24;const SH=24/16;
{const c=sprite.getContext('2d');SPR.forEach((r,y)=>[...r].forEach((ch,x)=>{if(PAL[ch]){c.fillStyle=PAL[ch];c.fillRect(x,y,1,1);}}));}
const px16=v=>Math.max(48,Math.round(v/16)*16);

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;
function resize(){const d=Math.min(window.devicePixelRatio||1,2);const vv=window.visualViewport;W=Math.round(vv?vv.width:innerWidth);H=Math.round(vv?vv.height:innerHeight);cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(()=>{resize();if(game&&!game.over)start(game.id);},300));if(window.visualViewport)visualViewport.addEventListener('resize',resize);resize();

const EMOJI_FONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function emo(c,ch,x,y,size){c.font=size+'px '+EMOJI_FONT;c.textAlign='center';c.textBaseline='middle';c.fillText(ch,x,y);}

// Capijuli: (x,y) = centro inferior, w = ancho
function drawCapy(c,x,y,w,sad){
  const h=w*SH;c.imageSmoothingEnabled=false;
  c.drawImage(sprite,Math.round(x-w/2),Math.round(y-h),w,h);
  if(sad)emo(c,'💫',x,y-h-w*0.12,w*0.32);
}
// Dónde está la cabeza (para apilar) y la caja de choque
function capInfo(w){const h=w*SH;return{dx:0,top:h,half:w*0.28,h};}
function capBox(x,y,w){const h=w*SH;return{l:x-w*0.3,r:x+w*0.3,t:y-h*0.9,b:y-h*0.04};}
const hitBox=(a,b)=>a.l<b.r&&a.r>b.l&&a.t<b.b&&a.b>b.t;

let AC=null,MASTER=null,soundOn=true;
try{soundOn=localStorage.getItem('capijuli_snd')!=='0';}catch(e){}
function ensureAC(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.gain.value=soundOn?1:0;MASTER.connect(AC.destination);}if(AC.state==='suspended')AC.resume();return true;}catch(e){return false;}}
let silentEl=null,unlocked=false;
function silentWav(){const n=8000,b=new Uint8Array(44+n),v=new DataView(b.buffer);const w=(o,t)=>{for(let i=0;i<t.length;i++)b[o+i]=t.charCodeAt(i);};w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);b.fill(128,44);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));}
function unlockAudio(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
  if(!ensureAC())return;
  try{if(AC.state!=='running')AC.resume();}catch(e){}
  if(!unlocked){unlocked=true;try{const bf=AC.createBuffer(1,1,22050),src=AC.createBufferSource();src.buffer=bf;src.connect(AC.destination);src.start(0);}catch(e){}}
  try{if(!silentEl){silentEl=new Audio(silentWav());silentEl.loop=true;silentEl.setAttribute('playsinline','');}if(soundOn&&silentEl.paused)silentEl.play().catch(()=>{});}catch(e){}
}
function tone(f,t,d,type,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+d+.02);}
function beep(f,d,type,v){if(!ensureAC())return;try{tone(f,AC.currentTime,d||.08,type||'sine',v||.14);}catch(e){}}
const mf=m=>440*Math.pow(2,(m-69)/12);
const SONGS={
  magia:{bpm:138,bar:6,
    lead:[76,0,0,74,72,0, 71,0,72,0,69,0, 72,0,0,77,76,0, 74,0,72,0,71,0, 69,0,72,0,76,0, 77,0,0,81,79,77, 76,0,74,0,68,0, 69,0,0,0,0,0,
          81,0,0,79,77,0, 76,0,77,0,74,0, 72,0,0,74,76,0, 71,0,0,0,68,0, 69,0,71,0,72,0, 74,0,72,0,71,0, 72,0,71,0,68,0, 69,0,0,0,0,0],
    bass:[45,45,41,40,45,38,40,45, 41,45,45,40,45,38,40,45],
    ch:{45:[57,60,64],41:[57,60,65],40:[56,59,64],38:[57,62,65]}},
  menu:{bpm:104,lead:[72,0,76,79,81,79,76,0, 74,0,77,81,79,77,74,0, 72,0,76,79,84,81,79,76, 74,76,74,71,72,0,0,0],bass:[48,50,48,43]},
  game:{bpm:140,lead:[76,79,81,79,76,74,72,74, 76,76,79,76,74,72,74,0, 72,74,76,79,81,84,81,79, 76,74,72,74,72,0,67,0],bass:[48,45,41,43]},
  leer:{bpm:88,lead:[67,0,72,0,76,0,74,72, 69,0,72,0,74,0,0,0, 67,0,72,0,76,0,79,77, 76,74,72,0,0,0,0,0],bass:[48,41,48,43]}
};
const music={song:null,step:0,next:0,timer:null};
let magicOn=false;try{magicOn=localStorage.getItem('capijuli_magia')==='1';}catch(e){}
function playSong(name){music.req=name;if(magicOn&&name)name='magia';if(music.song===name)return;music.song=name;music.step=0;if(!name)return;if(!ensureAC())return;music.next=AC.currentTime+.08;if(!music.timer)music.timer=setInterval(musicTick,60);}
function musicTick(){
  if(!AC||!music.song||!soundOn)return;
  const s=SONGS[music.song],dt=60/s.bpm/2;
  if(music.next<AC.currentTime-.1)music.next=AC.currentTime+.05;
  if(s.bar){while(music.next<AC.currentTime+.25){const i=music.step%s.lead.length,n=s.lead[i],t=music.next,bi=Math.floor(i/s.bar),bs=i%s.bar,b=s.bass[bi%s.bass.length];
      if(n){tone(mf(n),t,dt*3.2,'sine',.09);tone(mf(n)*2,t,dt*1.2,'sine',.025);tone(mf(n)*3,t,dt*.5,'triangle',.008);}
      if(bs===0)tone(mf(b),t,dt*5,'triangle',.08);
      if(bs===2||bs===4)(s.ch[b]||[]).forEach(c=>tone(mf(c),t,dt*1.6,'sine',.022));
      music.next+=dt;music.step++;}return;}
  while(music.next<AC.currentTime+.25){
    const i=music.step%s.lead.length,n=s.lead[i];
    if(n)tone(mf(n),music.next,dt*.9,'square',.03);
    if(i%8===0)tone(mf(s.bass[Math.floor(i/8)%s.bass.length]),music.next,dt*7,'triangle',.06);
    if(i%8===4)tone(mf(s.bass[Math.floor(i/8)%s.bass.length]+7),music.next,dt*3,'triangle',.04);
    music.next+=dt;music.step++;
  }
}
function setSound(on){soundOn=on;try{localStorage.setItem('capijuli_snd',on?'1':'0');}catch(e){}if(MASTER)MASTER.gain.value=on?1:0;if(!on){try{speechSynthesis.cancel();}catch(e){}try{silentEl&&silentEl.pause();}catch(e){}}else unlockAudio();document.getElementById('snd').textContent=on?'🔊':'🔇';if(on&&AC)music.next=AC.currentTime+.05;}


function getRec(k){try{return parseInt(localStorage.getItem('capijuli_'+k))||0;}catch(e){return 0;}}
function setRec(k,v){try{localStorage.setItem('capijuli_'+k,String(v));}catch(e){}}

let T=0;
function drawBg(groundY,scroll){
  ctx.fillStyle='#C9B3EC';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.85)';
  for(let i=0;i<14;i++){const sx=(i*97)%W,sy=(i*53)%Math.max(60,H*0.45);if(Math.sin(T*2+i)>0.2)ctx.fillRect(sx,sy,3,3);}
  ctx.fillStyle='rgba(247,236,255,.9)';

/* ---------- 1. Torre chill ---------- */
function Torre(){
  const M=Math.min(W,H),S=Math.min(84,M*0.15),cw=px16(Math.min(224,M*0.4,H*0.22)),GAP=Math.max(110,Math.min(170,H*0.2)),ci=capInfo(cw),G=H-70;
  const g={id:'torre',name:'Torre chill',msg:'¡Se cayó la torre!',score:0,over:false};
  const stack=[];let ph=0,speed=1.2,cam=0,cur=null,lose=null,wait=0;
  const top=()=>stack.length?{cx:stack[stack.length-1].x,y:stack[stack.length-1].y-S*0.82,half:S*0.5}:{cx:W/2,y:G-ci.top,half:ci.half};
  function spawn(){cur={ch:ITEMS[Math.floor(Math.random()*ITEMS.length)],x:W/2,y:top().y-GAP,vy:0,drop:false};ph=Math.random()*6;}
  spawn();
  g.down=()=>{if(!g.over&&cur&&!cur.drop&&!lose){cur.drop=true;beep(520,.05,'sine',.1);}};
  g.update=dt=>{
    const tp=top();const camT=Math.max(0,H*0.6-tp.y);cam+=(camT-cam)*Math.min(1,dt*4);
    if(lose){lose.vy+=1800*dt;lose.y+=lose.vy*dt;lose.x+=lose.vx*dt;lose.r+=lose.vr*dt;lose.t+=dt;if(lose.t>1&&!g.over)endGame(g);return;}
    if(!cur){wait-=dt;if(wait<=0)spawn();return;}
    if(!cur.drop){ph+=dt*speed;cur.x=W/2+Math.sin(ph)*(W/2-S*0.9);cur.y=tp.y-GAP;}
    else{
      cur.vy+=1900*dt;cur.y+=cur.vy*dt;
      if(cur.y>=tp.y){
        const d=cur.x-tp.cx;
        if(Math.abs(d)<=tp.half+S*0.32){stack.push({ch:cur.ch,x:cur.x,y:tp.y});g.score++;beep(600+Math.min(g.score,30)*18,.1,'triangle');speed=Math.min(3.8,speed+0.08);cur=null;wait=0.25;}
        else{const sg=d<0?-1:1;lose={ch:cur.ch,x:cur.x,y:tp.y,vx:sg*170,vy:-220,r:0,vr:sg*7,t:0};cur=null;beep(170,.4,'sawtooth',.1);}
      }
    }
  };
  g.draw=()=>{
    drawBg(G+cam,0);
    drawCapy(ctx,W/2-ci.dx,G+cam,cw,!!lose);
    stack.forEach(p=>emo(ctx,p.ch,p.x,p.y+cam-S*0.42,S));
    if(cur){
      if(!cur.drop){const tp=top();ctx.strokeStyle='rgba(91,58,142,.4)';ctx.setLineDash([4,7]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cur.x,cur.y+cam+4);ctx.lineTo(cur.x,tp.y+cam);ctx.stroke();ctx.setLineDash([]);}
      emo(ctx,cur.ch,cur.x,cur.y+cam-S*0.42,S);
    }
    if(lose){ctx.save();ctx.translate(lose.x,lose.y+cam-S*0.42);ctx.rotate(lose.r);emo(ctx,lose.ch,0,0,S);ctx.restore();}
    hud(g.score+' 🏗️');
  };

}

/* ---------- 2. Capijuli brinca ---------- */
function Brinca(){

  let y=0,vy=0,jumps=0,speed=270,obs=[],next=1.5,scroll=0,hit=null,pops=[];
  g.down=()=>{if(g.over||hit)return;if(jumps<2){vy=jumps?-660:-780;jumps++;beep(jumps===1?440:580,.07,'square',.06);}};
  function spawn(){
    const r=Math.random();
    if(r<0.2){obs.push({t:'nar',x:W+20,w:34,h:34,yb:G-110-Math.random()*40});return;}
    const k=Math.random();
    if(k<0.4)obs.push({t:'roca',x:W+20,w:38,h:34,yb:G});
    else if(k<0.75)obs.push({t:'croc',x:W+20,w:56,h:26,yb:G});
    else obs.push({t:'charco',x:W+20,w:68,h:8,yb:G});
  }
  g.update=dt=>{
    T+=0;if(hit){hit.t+=dt;if(hit.t>0.8&&!g.over)endGame(g);return;}
    speed=Math.min(620,speed+7*dt);scroll+=speed*dt;
    vy+=2300*dt;y+=vy*dt;if(y>0){y=0;vy=0;jumps=0;}
    next-=dt;if(next<=0){spawn();next=(0.85+Math.random()*1.1)*(300/speed)+0.4;}

      if(o.t==='nar'){if(!o.got&&hitBox(cb,ob)){o.got=true;g.score++;pops.push({x:o.x,y:o.yb-40,t:0});beep(880,.08,'triangle');}continue;}

      if(!o.p&&o.x+o.w<cb.l){o.p=true;g.score++;}

/* ---------- 3. Atrapa la lluvia ---------- */
function Atrapa(){
  const cw=px16(Math.min(160,Math.min(W,H)*0.28,H*0.22)),G=H-Math.min(60,H*0.12),IS=Math.round(Math.min(60,Math.min(W,H)*0.1));

  function spawn(){
    const badP=Math.min(0.38,0.2+g.score*0.004),r=Math.random();
    const t=r<badP?'bad':r<badP+0.12?'san':'nar';
    const ch=t==='bad'?(Math.random()<0.5?'🐝':'🌵'):t==='san'?'🍉':'🍊';

  }

    if(endT>=0){endT+=dt;if(endT>0.6&&!g.over)endGame(g);return;}
    x+=(tx-x)*Math.min(1,dt*10);x=Math.max(cw/2,Math.min(W-cw/2,x));
    flash=Math.max(0,flash-dt);

    const catchY=G-capInfo(cw).h*0.75;

      it.y+=it.vy*dt;

        it.done=true;

        else{const p=it.t==='san'?3:1;g.score+=p;pops.push({txt:'+'+p,x:it.x,y:catchY,t:0});beep(it.t==='san'?990:760,.08,'triangle');}
      }

    items=items.filter(it=>!it.done&&it.y<H+40);

    ctx.font='800 24px system-ui,sans-serif';ctx.fillStyle='#E8803A';ctx.textAlign='center';

function Vuela(){
  const M=Math.min(W,H),cw=px16(Math.min(96,M*0.17)),G=H-Math.min(60,H*0.1),X=Math.max(70,W*0.28);

  g.down=()=>{if(dead)return;ready=false;vy=-Math.min(430,H*0.62);flapT=.18;beep(620,.06,'triangle',.08);};

  g.update=dt=>{

    cols=cols.filter(c=>c.x>-120);hearts=hearts.filter(h=>h.x>-40&&!h.got);
    pops.forEach(p=>p.t+=dt);pops=pops.filter(p=>p.t<.6);
  };
  g.draw=()=>{

    drawCat(ctx,X,y,cw,rot,flapT>0||(ready&&Math.sin(t*10)>0));
    ctx.font='800 22px system-ui,sans-serif';ctx.fillStyle='#E5484D';ctx.textAlign='center';ctx.textBaseline='middle';
    pops.forEach(p=>ctx.fillText('+1',p.x,p.y-20-p.t*50));

const MAGIC_PAIRS=[['🐸','🦋'],['🥚','🐥'],['🎃','🍭'],['☁️','🌈'],['🪨','💎'],['🍂','🌸'],['🐛','🦋'],['🌑','🌟'],['🧦','🎁'],['🥕','🍰']];
function drawMago(c,x,y,w,drawFn,wave){
  const h=w*1.5;
  c.fillStyle='#4B2C8F';c.beginPath();c.moveTo(x-w*.28,y-h*.46);c.lineTo(x+w*.28,y-h*.46);c.lineTo(x+w*.5,y-h*.06);c.lineTo(x-w*.5,y-h*.06);c.closePath();c.fill();
  c.fillStyle='#FFD23F';c.fillRect(x-w*.36,y-h*.12,w*.72,w*.05);
  drawFn(c,x,y,w);
  const hb=y-h*.86,hw=w*1.05,hh=h*.5;
  c.fillStyle='#5B3FA6';c.beginPath();c.moveTo(x-hw*.36,hb);c.lineTo(x+hw*.36,hb);c.lineTo(x+hw*.12,hb-hh*.7);c.lineTo(x+hw*.28,hb-hh);c.lineTo(x-hw*.02,hb-hh*.72);c.closePath();c.fill();
  c.fillStyle='#3E2A7A';c.fillRect(x-hw*.55,hb-w*.02,hw*1.1,w*.1);
  c.fillStyle='#FFD23F';[[-.12,.25],[.1,.45],[-.02,.6]].forEach(([dx,dy])=>{const sx=x+hw*dx,sy=hb-hh*dy,r=w*.045;c.fillRect(sx-r,sy-r*.3,r*2,r*.6);c.fillRect(sx-r*.3,sy-r,r*.6,r*2);});
  const a=-0.9+(wave||0)*.5,hx=x+w*.4,hy=y-h*.42,L=w*.75,tx=hx+Math.cos(a)*L,ty=hy+Math.sin(a)*L;
  c.strokeStyle='#6B3E1E';c.lineWidth=Math.max(3,w*.07);c.beginPath();c.moveTo(hx,hy);c.lineTo(tx,ty);c.stroke();
  c.globalAlpha=.35+.25*Math.sin(T*8);c.fillStyle='#FFF3A0';c.beginPath();c.arc(tx,ty,w*.22,0,7);c.fill();c.globalAlpha=1;
  emo(c,'⭐',tx,ty,w*.3);

}
function Magia(cfg){

  g.down=(x,y)=>{let best=null,bd=1e9;items.forEach(it=>{if(it.done)return;const d=Math.hypot(x-it.x,y-it.y);if(d<sz()*.85&&d<bd){bd=d;best=it;}});
    if(best){best.done=1;g.score++;wave=1;beams.push({x:best.x,y:best.y,t:.35});
      if(typeof AC!=='undefined'&&ensureAC()){const t0=AC.currentTime;[84,88,91,96].forEach((m,i)=>{try{tone(mf(m),t0+i*.05,.25,'sine',.06);}catch(e){}});}

  const sp=[];function sparks(x,y){for(let i=0;i<16;i++){const a=Math.random()*7,s=80+Math.random()*200;sp.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.8,c:['#FFD23F','#FFFFFF','#C9A7FF','#7CFFE0'][i%4]});}}
  g.update=dt=>{time-=dt;if(time<=0){endGame(g);return;}wave=Math.max(0,wave-dt*4);
    spawn-=dt;if(spawn<=0){const p=MAGIC_PAIRS[Math.floor(Math.random()*MAGIC_PAIRS.length)];items.push({a:p[0],b:p[1],x:X+ww+Math.random()*(W-X-ww-sz()),y:H+sz(),ph:Math.random()*6,v:cfg.speed*(0.8+Math.random()*.4)*Math.max(.8,H/700),done:0});spawn=cfg.every*(0.7+Math.random()*.6);}
    items.forEach(it=>{if(it.done){it.done+=dt;it.y-=dt*30;}else{it.y-=it.v*dt;it.x+=Math.sin(T*2+it.ph)*20*dt;}});
    items=items.filter(it=>it.y>-sz()&&it.done<1.4);

    for(let i=0;i<40;i++){const sx=(i*137)%W,sy=(i*71)%(H*.8);ctx.globalAlpha=.4+.6*Math.abs(Math.sin(T*1.5+i));ctx.fillStyle='#fff';ctx.fillRect(sx,sy,3,3);}ctx.globalAlpha=1;
    ctx.fillStyle='#FFF4C2';ctx.beginPath();ctx.arc(W-90,90,42,0,7);ctx.fill();ctx.fillStyle='#1B1440';ctx.beginPath();ctx.arc(W-72,78,38,0,7);ctx.fill();
    ctx.fillStyle='#2A1B5C';ctx.fillRect(0,G,W,H-G);ctx.fillStyle='#3B2878';ctx.fillRect(0,G,W,5);
    items.forEach(it=>{const s=sz();if(it.done){ctx.globalAlpha=Math.max(0,1-(it.done-.9)*2);emo(ctx,it.b,it.x,it.y,s*(1+Math.min(.3,it.done)));ctx.globalAlpha=1;}
      else{ctx.globalAlpha=.25;ctx.fillStyle='#C9A7FF';ctx.beginPath();ctx.arc(it.x,it.y,s*.6,0,7);ctx.fill();ctx.globalAlpha=1;emo(ctx,it.a,it.x,it.y,s);}});
    tip=drawMago(ctx,X,G,ww,cfg.draw,wave);
    beams.forEach(b=>{ctx.globalAlpha=b.t/.35;ctx.strokeStyle='#FFF3A0';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(tip.tx,tip.ty);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;});
    sp.forEach(p=>{ctx.fillStyle=p.c;ctx.fillRect(p.x-3,p.y-3,6,6);});
    const tw=Math.min(W*.5,300);ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(W/2-tw/2,24,tw,12);ctx.fillStyle='#FFD23F';ctx.fillRect(W/2-tw/2,24,tw*Math.max(0,time)/45,12);
    cfg.hud(g.score);};
  return g;
}

let A=null;
const ARMA_WORDS=['sol','pez','oso','pan','pie','uva','mar','gato','pato','casa','luna','vaca','mano','rana','dado','taza','bota','nube','cama','mono','sopa','coco','tren','flor'];
const EMO={sol:'☀️',pez:'🐟',oso:'🐻',pan:'🍞',pie:'🦶',uva:'🍇',mar:'🌊',gato:'🐱',pato:'🦆',casa:'🏠',luna:'🌙',vaca:'🐮',mano:'✋',rana:'🐸',dado:'🎲',taza:'☕',bota:'👢',nube:'☁️',cama:'🛏️',mono:'🐵',sopa:'🍲',coco:'🥥',tren:'🚂',flor:'🌸'};
const SPELL={cat:['🐱','gato'],dog:['🐶','perro'],sun:['☀️','sol'],hat:['🎩','sombrero'],pig:['🐷','cerdito'],cow:['🐮','vaca'],bus:['🚌','autobús'],bed:['🛏️','cama'],egg:['🥚','huevo'],cup:['☕','taza'],fish:['🐟','pez'],frog:['🐸','rana'],duck:['🦆','pato'],star:['⭐','estrella'],cake:['🎂','pastel'],tree:['🌳','árbol'],moon:['🌙','luna'],ball:['⚽','pelota'],bear:['🐻','oso'],milk:['🥛','leche'],book:['📖','libro']};
const ES=t=>[t,null,'es'],EN=(t,fn)=>[t,fn||null,'en'];
function startArma(lang){
  const list=lang==='en'?Object.keys(SPELL):ARMA_WORDS;
  const three=shuffle(list.filter(w=>w.length===3)).slice(0,3),four=shuffle(list.filter(w=>w.length>3)).slice(0,5);
  const g=lang==='en'?{id:'spell',name:'Spelling en inglés',msg:'Great job! ¡Lo hiciste muy bien!'}:{id:'arma',name:'Arma la palabra',msg:'¡Armaste todas las palabras!'};
  Object.assign(g,{score:0,over:false,update(){},down(){},draw(){drawBg(H-60,0);}});
  game=g;A={g,lang,ws:three.concat(four),i:0,pos:0,miss:0,wordMiss:0,results:[],first:true,lock:false};
  $('a_rep').style.background=lang==='en'?'#3A6FD8':'#C0569A';
  $('arma').classList.remove('hide');showA();
}
const LN_EN={a:'ay',b:'bee',c:'see',d:'dee',e:'ee',f:'eff',g:'jee',h:'aitch',i:'eye',j:'jay',k:'kay',l:'el',m:'em',n:'en',o:'oh',p:'pee',q:'cue',r:'ar',s:'ess',t:'tee',u:'you',v:'vee',w:'double you',x:'ex',y:'why',z:'zee'};
const L1=ch=>A.lang==='en'?EN(LN_EN[ch]||ch):ES(LN[ch]||ch);
function aPrompt(full){
  const w=A.ws[A.i],ch=w[A.pos],parts=[];
  if(A.lang==='en'){
    if(A.first){parts.push(ES('¡Hola Juli! Vamos a jugar spelling en inglés. Escucha la palabra y toca las letras en orden.'));A.first=false;}
    if(full||A.pos===0){parts.push(ES(SPELL[w][1]+', en inglés, se dice:'));parts.push(EN(w));}
    if(ch){parts.push(ES(A.pos===0?'Empieza con la':'Ahora busca la'));parts.push(L1(ch));}
  }else{
    if(A.first){parts.push(ES('¡Hola Juli! Vamos a armar palabras. Escucha, y toca las letras en orden.'));A.first=false;}
    if(full||A.pos===0)parts.push(ES('Arma la palabra: '+w+'.'));
    if(ch)parts.push(ES((A.pos===0?'Empieza con la ':'Ahora busca la ')+LN[ch]+'.'));
  }
  say(parts);
}
function showA(){
  const w=A.ws[A.i],ghost=A.i<5;A.pos=0;A.wordMiss=0;A.miss=0;A.lock=false;
  $('a_pic').innerHTML=(A.lang==='en'?SPELL[w][0]+'<div style="font-size:18px;color:#7A63A0;font-weight:700">('+SPELL[w][1]+')</div>':EMO[w]);
  $('a_pic').onclick=()=>aPrompt(true);$('a_rep').onclick=()=>aPrompt(true);
  $('a_stars').textContent=A.results.map(r=>r?'⭐':'☆').join('')+'·'.repeat(A.ws.length-A.results.length);
  const sl=$('a_slots');sl.innerHTML='';
  [...w].forEach((ch,i)=>{const d=document.createElement('div');d.className='slot'+(ghost?' ghost':'')+(i===0?' cur':'');d.textContent=ghost?ch:'';sl.appendChild(d);});
  const extra=shuffle('abdeilmnoprstu'.split('').filter(c=>!w.includes(c))).slice(0,w.length<=3?2:3);
  const tl=$('a_tiles');tl.innerHTML='';
  shuffle([...w].concat(extra)).forEach(ch=>{const b=document.createElement('button');b.className='tile';b.textContent=ch;b.onclick=()=>tapTile(b,ch);tl.appendChild(b);});
  $('a_hint').textContent=A.lang==='en'?'Toca las letras en orden · Tap the letters':'Toca las letras en orden';
  setTimeout(()=>aPrompt(true),250);
}
function tapTile(b,ch){
  if(A.lock||b.classList.contains('used'))return;
  const w=A.ws[A.i],need=w[A.pos],slots=[...$('a_slots').children],en=A.lang==='en';
  if(ch===need){
    b.classList.add('used');b.classList.remove('pulse');[...$('a_tiles').children].forEach(t=>t.classList.remove('pulse','no'));
    const sl=slots[A.pos];sl.textContent=ch;sl.classList.remove('ghost','cur');sl.classList.add('done');
    beep(660+A.pos*120,.09,'triangle');A.pos++;A.miss=0;$('a_hint').textContent='Toca las letras en orden';
    if(A.pos>=w.length){
      A.lock=true;const ok=A.wordMiss===0;if(ok)A.g.score++;A.results.push(ok);fx('good',en?'Great job!':null);
      setTimeout(()=>beep(1175,.12,'triangle'),120);setTimeout(()=>beep(1568,.16,'triangle'),240);
      $('a_hint').textContent=(en?'Great! ':'¡Muy bien! ')+'"'+w+'"'+(en?' = '+SPELL[w][1]:'');
      const clear=()=>slots.forEach(x=>x.style.background='');
      const parts=[en?EN('Great job!'):ES('¡Muy bien!')];
      [...w].forEach((c,i)=>{const p=L1(c);p[1]=()=>{clear();slots[i].style.background='#FFE066';};parts.push(p);});
      const lastP=en?EN(w+'!'):ES(w+'.');lastP[1]=()=>slots.forEach(x=>x.style.background='#FFE066');parts.push(lastP);
      if(en)parts.push(ES(SPELL[w][1]+'.'));
      say(parts,()=>{clear();setTimeout(()=>{A.i++;if(A.i>=A.ws.length){$('arma').classList.add('hide');say([en?EN('You did it!'):ES('¡Terminaste! Eres una campeona.')]);endGame(A.g);}else showA();},400);});
    }else{slots[A.pos].classList.add('cur');say([L1(ch),ES('Ahora busca la'),L1(w[A.pos])]);}
  }else{
    A.miss++;A.wordMiss++;b.classList.remove('no');void b.offsetWidth;b.classList.add('no');beep(200,.18,'sawtooth',.07);
    if(A.miss>=2){const t=[...$('a_tiles').children].find(t=>!t.classList.contains('used')&&t.textContent===need);t&&t.classList.add('pulse');
      $('a_hint').textContent='¡Es la que brilla!';say([ES('Esa es la'),L1(ch),ES('Mira, la'),L1(need),ES('es la que brilla.')]);}
    else{$('a_hint').textContent='Casi… busca la '+need.toUpperCase()+' '+need;say([ES('Esa es la'),L1(ch),ES('Busca la'),L1(need)]);}
  }
}
function hideAll(){sayId++;try{speechSynthesis.cancel();}catch(e){}['menu','over','leer','arma','psel','pbar'].forEach(k=>$(k).classList.add('hide'));document.body.classList.remove('piano');}
function start(id){lastId=id;ensureAC();hideAll();
  if(id==='leer'){playSong('leer');startLeer();return;}
  if(id==='arma'||id==='spell'){playSong('leer');startArma(id==='spell'?'en':'es');return;}
  if(id==='piano'){game=null;playSong('menu');showPianoSelect();return;}
  playSong('game');game=MAKERS[id]();}
function toMenu(){game=null;L=null;try{speechSynthesis.cancel();}catch(e){}hideAll();refreshRecs();$('menu').classList.remove('hide');playSong('menu');}
function refreshRecs(){['torre','brinca','atrapa','vuela','magia','leer','arma','spell','piano'].forEach(k=>$('r_'+k).textContent=getRec(k));}
function endGame(g){
  g.over=true;
  const prev=getRec(g.id),nuevo=g.score>prev;if(nuevo)setRec(g.id,g.score);
  $('o_msg').textContent=g.msg;$('o_game').textContent=g.name;$('o_score').textContent=g.id==='leer'?g.score+'/10':(g.id==='arma'||g.id==='spell')?g.score+'/8':g.score;
  $('o_rec').textContent=Math.max(prev,g.score);$('newrec').classList.toggle('hide',!nuevo||g.score===0);
  const txt='¡Hice '+g.score+' puntos en "'+g.name+'" de Capijuli! 🌸 ¿Me ganas? '+location.href;
  $('o_share').href='https://wa.me/?text='+encodeURIComponent(txt);
  $('o_again').onclick=g.again||(()=>start(g.id));if(g.id==='piano'){$('pbar').classList.add('hide');document.body.classList.remove('piano');playSong('menu');if(!g.score)$('o_score').textContent='🎹';}
  setTimeout(()=>{if(game===g)$('over').classList.remove('hide');},350);
}

$('snd').textContent=soundOn?'🔊':'🔇';
$('snd').addEventListener('click',e=>{e.stopPropagation();ensureAC();setSound(!soundOn);if(soundOn&&!music.song)playSong(game?'game':'menu');});
['pointerdown','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,()=>{unlockAudio();if(AC&&!music.song&&!(game&&game.id==='piano'))playSong(game?((game.id==='leer'||game.id==='arma'||game.id==='spell')?'leer':'game'):'menu');},{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&AC){try{AC.resume();}catch(e){}if(silentEl&&soundOn)silentEl.play().catch(()=>{});}});
try{speechSynthesis.getVoices();}catch(e){}
cv.addEventListener('pointerdown',e=>{if(game&&!game.over)game.down(e.clientX,e.clientY);e.preventDefault();});
cv.addEventListener('pointermove',e=>{if(game&&game.move&&!game.over)game.move(e.clientX);});
addEventListener('keydown',e=>{
  if(!game||game.over)return;
  if(e.code==='ArrowLeft'&&game.nudge)game.nudge(-1);
  else if(e.code==='ArrowRight'&&game.nudge)game.nudge(1);
  else if(e.code==='Space'||e.code==='ArrowUp'){game.down(W/2,0);e.preventDefault();}
});

function drawMini(){
  const m=$('mini'),c=m.getContext('2d');c.clearRect(0,0,m.width,m.height);
  const w=144,ci=capInfo(w);drawCapy(c,160,282,w);
  emo(c,'🍊',160,282-ci.top-24,50);
}
drawMini();refreshRecs();

let last=0;
function loop(t){
  const dt=Math.min(0.033,(t-last)/1000||0);last=t;T+=dt;
  if(game){game.update(dt);game.draw();}
  else{drawBg(H-70,0);}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function setMagic(on){magicOn=on;try{localStorage.setItem('capijuli_magia',on?'1':'0');}catch(e){}$('mag').style.background=on?'#FFE27A':'rgba(255,255,255,.9)';$('mag').style.boxShadow=on?'0 0 0 3px #8E5CC9':'0 2px 6px rgba(0,0,0,.15)';const r=music.req;music.song=null;if(r)playSong(r);}
setMagic(magicOn);
$('mag').addEventListener('click',e=>{e.stopPropagation();unlockAudio();setMagic(!magicOn);if(!music.song&&!(game&&game.id==='piano'))playSong(game?'game':'menu');});
</script>
</body>
