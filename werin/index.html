<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Súper Werin</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#8FD3FF;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
canvas#c{display:block;position:fixed;left:0;top:0}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:14px;background:rgba(232,246,255,.95);text-align:center;padding:18px;box-sizing:border-box;overflow:auto}
.hide{display:none!important}
h1{font-family:'Press Start 2P',monospace;font-size:30px;margin:4px 0;color:#1F4FA8;text-shadow:3px 3px 0 #FFD23F}
h2{font-size:30px;margin:0;color:#1F4FA8}
.sub{color:#3A6FB0;font-size:20px;margin:0}
.big{font-size:60px;font-weight:800;color:#2F6FE0;margin:0;line-height:1;font-family:'Press Start 2P',monospace}
.btn{width:min(360px,90vw);padding:14px 16px;border:0;border-radius:22px;font-size:26px;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2);font-family:inherit;text-decoration:none;display:flex;align-items:center;gap:14px;box-sizing:border-box;text-align:left}
.btn .ic{font-size:46px;line-height:1}
.btn small{display:block;font-weight:500;font-size:15px;opacity:.95}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.b1{background:#2F8A3E}.b2{background:#2F6FE0}.b3{background:#E5484D}.b4{background:#E8A23A}.bw{background:#25D366;justify-content:center}.bn{background:#8C9AAE;justify-content:center;font-size:20px;padding:10px}
#snd,#back{position:fixed;z-index:50;width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:24px;box-shadow:0 2px 6px rgba(0,0,0,.18);cursor:pointer}
#snd{right:12px;bottom:12px}#back{left:12px;top:12px;font-size:26px;font-weight:800;color:#1F4FA8}
#fx{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:20;opacity:0;transition:opacity .2s}
#fx.show{opacity:1}
#fx .tx{font-size:min(52px,11vw);font-weight:900;color:#fff;text-shadow:0 4px 0 #1F4FA8,0 0 18px rgba(0,0,0,.25);animation:pop .5s;font-family:'Press Start 2P',monospace;line-height:1.3;padding:0 10px}
#fx .ic{font-size:120px;animation:pop .5s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.conf{position:fixed;top:-50px;font-size:36px;z-index:21;pointer-events:none;animation:fall 1.7s linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(400deg)}}
#ver{position:fixed;left:10px;bottom:6px;margin:0;font-size:11px;color:#7FA6CC}
@media (max-height:600px){h1{font-size:22px}.btn{padding:9px 14px;font-size:21px}.btn .ic{font-size:36px}#mini{display:none}.ov{gap:9px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu" class="ov">
  <canvas id="mini" width="200" height="200" style="width:120px;height:120px;image-rendering:pixelated"></canvas>
  <h1>Súper Werin</h1>
  <p class="sub">¿A qué jugamos?</p>
  <button class="btn b1" onclick="start('td')"><span class="ic">🏈</span><span>¡Touchdown!<small>Toca para brincar · ⭐ <span id="r_td">0</span></small></span></button>
  <button class="btn b2" onclick="start('robot')"><span class="ic">🤖</span><span>Arma tu robot<small>Toca y toca · ⭐ <span id="r_robot">0</span></small></span></button>
  <button class="btn b3" onclick="start('pum')"><span class="ic">💥</span><span>Atrapa robots<small>Toca los robots · ⭐ <span id="r_pum">0</span></small></span></button>
  <button class="btn b4" onclick="start('trepa')"><span class="ic">🏙️</span><span>Súper trepa<small>Toca para subir · ⭐ <span id="r_trepa">0</span></small></span></button>
  <button class="btn" style="background:#5B3FA6" onclick="start('magia')"><span class="ic">🪄</span><span>Werin el Mago<small>Toca con tu varita · ⭐ <span id="r_magia">0</span></small></span></button>
  <p id="ver"></p>
</div>

<div id="over" class="ov hide">
  <canvas id="mini2" width="200" height="200" style="width:110px;height:110px;image-rendering:pixelated"></canvas>
  <h2 id="o_msg">¡Súper Werin!</h2>
  <p class="sub" id="o_game"></p>
  <p class="big" id="o_score">0</p>
  <p class="sub">Récord: <b id="o_rec">0</b></p>
  <button class="btn b2" id="o_again" style="justify-content:center">Otra vez</button>
  <a class="btn bw" id="o_share" target="_blank" rel="noopener">Mandar por WhatsApp</a>
  <button class="btn bn" onclick="toMenu()">Menú</button>
</div>

<div id="fx"></div>
<button id="back" class="hide" aria-label="Menú">←</button>
<button id="mag" aria-label="Música mágica" style="position:fixed;right:70px;bottom:12px;z-index:50;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:22px;box-shadow:0 2px 6px rgba(0,0,0,.15);cursor:pointer">🪄</button>
<button id="snd" aria-label="Sonido">🔊</button>

<script>
const VERSION='2026-11-12.13';
const $=id=>document.getElementById(id);
$('ver').textContent='v'+VERSION;
const cv=$('c'),ctx=cv.getContext('2d');let W=0,H=0;
function resize(){const d=Math.min(window.devicePixelRatio||1,2);const vv=window.visualViewport;W=Math.round(vv?vv.width:innerWidth);H=Math.round(vv?vv.height:innerHeight);cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0);ctx.imageSmoothingEnabled=false;}
resize();addEventListener('resize',resize);if(window.visualViewport)visualViewport.addEventListener('resize',resize);
const EMOJI_FONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function emo(c,ch,x,y,size){c.font=size+'px '+EMOJI_FONT;c.textAlign='center';c.textBaseline='middle';c.fillText(ch,x,y);}

/* ---------- Werin pixel ---------- */
const PAL={H:'#9A6634',h:'#C48A4C',s:'#5E3A1A',F:'#F6D2B0',f:'#F0A98E',E:'#2E2118',W:'#FFFFFF',m:'#B5483D',B:'#2F6FE0',b:'#1F4FA8',Y:'#FFD23F',R:'#E5484D',r:'#B8323A',K:'#FFFFFF'};
const TOP=[
"...hH.hHh.Hh....",
"..hHHhHHHhHHHh..",
".hHsHHhHsHHhHsH.",
"hHHHsHHHHsHHHsHh",
"HHsHFHHFFHHFHsHH",
"HHHFFFFFFFFFFHHH",
"sHFFFFFFFFFFFFHs",
"sHFEEFFFFFFEEFHs",
".HFEKFFFFFFEKFH.",
".HFfFFFFFFFFfFH.",
"..FFmWWWWWWmFF..",
"...FFmWWWWmFF...",
"....FFmmmmFF....",
"...bBBBBBBBBb...",
"..BBBBBYYBBBBB..",
"..BBBBYYBBBBBB..",
"..FBBYYYYYBBBF..",
"...bBBBYYBBBb...",
"....bBBYBBBb...."];
const LEGS=[[
"....BBB..BBB....",
"....BBB..BBB....",
"....bbb..bbb....",
"...RRRR..RRRR...",
"...rrrr..rrrr..."],[
"...BBB....BBB...",
"..BBB......BBB..",
"..bbb......bbb..",
".RRRR......RRRR.",
".rrrr......rrrr."],[
"....BBB..BBB....",
"...BBB....BBB...",
"...bbb....bbb...",
"..RRRR....RRRR..",
"..rrrr....rrrr.."]];
const SW=16,SH=24;
function mkSprite(legs){const s=document.createElement('canvas');s.width=SW;s.height=SH;const c=s.getContext('2d');
  TOP.concat(legs).forEach((row,y)=>{if(row.length!==16)console.warn('row',y,row.length);[...row].forEach((ch,x)=>{if(ch!=='.'&&PAL[ch]){c.fillStyle=PAL[ch];c.fillRect(x,y,1,1);}});});return s;}
const SPR=LEGS.map(mkSprite);
function drawWerin(c,x,y,w,frame,tilt){ // x center, y feet
  const h=w*SH/SW;c.save();c.imageSmoothingEnabled=false;c.translate(Math.round(x),Math.round(y));if(tilt)c.rotate(tilt);
  c.drawImage(SPR[frame||0],-w/2,-h,w,h);c.restore();}
const px16=w=>Math.max(32,Math.round(w/16)*16);
function drawMini(id,frame){const m=$(id),c=m.getContext('2d');c.clearRect(0,0,200,200);c.imageSmoothingEnabled=false;c.drawImage(SPR[frame||0],100-64,8,128,192);}

/* ---------- audio ---------- */
let AC=null,MASTER=null,soundOn=true;
try{soundOn=localStorage.getItem('werin_snd')!=='0';}catch(e){}
function ensureAC(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.gain.value=soundOn?1:0;MASTER.connect(AC.destination);}if(AC.state==='suspended')AC.resume();return true;}catch(e){return false;}}
let silentEl=null,unlocked=false;
function silentWav(){const n=8000,b=new Uint8Array(44+n),v=new DataView(b.buffer);const w=(o,t)=>{for(let i=0;i<t.length;i++)b[o+i]=t.charCodeAt(i);};w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);b.fill(128,44);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));}
function unlockAudio(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
  if(!ensureAC())return;try{if(AC.state!=='running')AC.resume();}catch(e){}
  if(!unlocked){unlocked=true;try{const bf=AC.createBuffer(1,1,22050),src=AC.createBufferSource();src.buffer=bf;src.connect(AC.destination);src.start(0);}catch(e){}}
  try{if(!silentEl){silentEl=new Audio(silentWav());silentEl.loop=true;silentEl.setAttribute('playsinline','');}if(soundOn&&silentEl.paused)silentEl.play().catch(()=>{});}catch(e){}
}
function tone(f,t,d,type,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+d+.02);}
function beep(f,d,type,v){if(!ensureAC())return;try{tone(f,AC.currentTime,d||.08,type||'sine',v||.14);}catch(e){}}
function sweep(f1,f2,d,type,v){if(!ensureAC())return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+d+.02);}catch(e){}}
function fanfare(){if(!ensureAC())return;const t=AC.currentTime;[[67,0],[72,.12],[76,.24],[79,.36],[76,.52],[79,.64]].forEach(([m,d])=>{try{tone(mf(m),t+d,.22,'square',.07);tone(mf(m-12),t+d,.22,'triangle',.08);}catch(e){}});}
const mf=m=>440*Math.pow(2,(m-69)/12);
const SONGS={
  magia:{bpm:138,bar:6,
    lead:[76,0,0,74,72,0, 71,0,72,0,69,0, 72,0,0,77,76,0, 74,0,72,0,71,0, 69,0,72,0,76,0, 77,0,0,81,79,77, 76,0,74,0,68,0, 69,0,0,0,0,0,
          81,0,0,79,77,0, 76,0,77,0,74,0, 72,0,0,74,76,0, 71,0,0,0,68,0, 69,0,71,0,72,0, 74,0,72,0,71,0, 72,0,71,0,68,0, 69,0,0,0,0,0],
    bass:[45,45,41,40,45,38,40,45, 41,45,45,40,45,38,40,45],
    ch:{45:[57,60,64],41:[57,60,65],40:[56,59,64],38:[57,62,65]}},
  menu:{bpm:110,lead:[72,0,74,76,79,0,76,0, 77,0,76,74,72,0,0,0, 72,0,74,76,79,0,84,0, 81,79,77,76,74,0,0,0],bass:[48,53,48,43]},
  game:{bpm:150,lead:[72,72,79,79,81,81,79,0, 77,77,76,76,74,74,72,0, 79,79,77,77,76,76,74,0, 79,79,77,77,76,76,74,0],bass:[48,41,48,43]},
  robot:{bpm:120,lead:[60,0,67,0,72,0,67,0, 62,0,69,0,74,0,69,0, 64,0,71,0,76,0,71,0, 65,67,69,71,72,0,0,0],bass:[36,38,40,41]}
};
const music={song:null,step:0,next:0,timer:null};
let magicOn=false;try{magicOn=localStorage.getItem('werin_magia')==='1';}catch(e){}
function playSong(name){music.req=name;if(magicOn&&name)name='magia';if(music.song===name)return;music.song=name;music.step=0;if(!name)return;if(!ensureAC())return;music.next=AC.currentTime+.08;if(!music.timer)music.timer=setInterval(musicTick,60);}
function musicTick(){
  if(!AC||!music.song||!soundOn)return;
  const s=SONGS[music.song],dt=60/s.bpm/2;
  if(music.next<AC.currentTime-.1)music.next=AC.currentTime+.05;
  if(s.bar){while(music.next<AC.currentTime+.25){const i=music.step%s.lead.length,n=s.lead[i],t=music.next,bi=Math.floor(i/s.bar),bs=i%s.bar,b=s.bass[bi%s.bass.length];
      if(n){tone(mf(n),t,dt*3.2,'sine',.09);tone(mf(n)*2,t,dt*1.2,'sine',.025);tone(mf(n)*3,t,dt*.5,'triangle',.008);}
      if(bs===0)tone(mf(b),t,dt*5,'triangle',.08);
      if(bs===2||bs===4)(s.ch[b]||[]).forEach(c=>tone(mf(c),t,dt*1.6,'sine',.022));
      music.next+=dt;music.step++;}return;}
  while(music.next<AC.currentTime+.25){const i=music.step%s.lead.length,n=s.lead[i];
    if(n)tone(mf(n),music.next,dt*.9,'square',.026);
    if(i%8===0)tone(mf(s.bass[Math.floor(i/8)%s.bass.length]),music.next,dt*7,'triangle',.06);
    if(i%4===2)tone(mf(s.bass[Math.floor(i/8)%s.bass.length]+12),music.next,dt*1.5,'triangle',.035);
    music.next+=dt;music.step++;}}
function setSound(on){soundOn=on;try{localStorage.setItem('werin_snd',on?'1':'0');}catch(e){}if(MASTER)MASTER.gain.value=on?1:0;if(!on){try{speechSynthesis.cancel();}catch(e){}try{silentEl&&silentEl.pause();}catch(e){}}else unlockAudio();$('snd').textContent=on?'🔊':'🔇';if(on&&AC)music.next=AC.currentTime+.05;}

/* ---------- voz ---------- */
let VOICE=null,sayId=0;
function rankVoices(){try{const vs=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));if(!vs.length)return;
  const sc=v=>{const n=(v.name||'').toLowerCase();let k=0;if(/(mx|us|419)/i.test(v.lang))k+=3;if(/natural|neural|enhanced|premium|mejorad|siri|online/.test(n))k+=6;if(/google/.test(n))k+=4;if(/paulina|m[oó]nica|dalia|marisol|sabina|helena|jorge|juan/.test(n))k+=2;if(/compact|eloquence|grandma|grandpa|rocko|shelley|flo|reed|sandy|eddy/.test(n))k-=5;return k;};
  VOICE=vs.sort((a,b)=>sc(b)-sc(a))[0];}catch(e){}}
try{rankVoices();speechSynthesis.onvoiceschanged=rankVoices;}catch(e){}
function say(txt){const id=++sayId;try{speechSynthesis.cancel();}catch(e){}if(!soundOn||!window.speechSynthesis)return;
  try{if(!VOICE)rankVoices();const u=new SpeechSynthesisUtterance(txt);u.lang=VOICE?VOICE.lang:'es-MX';if(VOICE)u.voice=VOICE;u.rate=.9;u.pitch=1.12;setTimeout(()=>{if(id===sayId)speechSynthesis.speak(u);},60);}catch(e){}}

/* ---------- efectos ---------- */
function fx(txt,ic,confs){const el=$('fx');el.className='show';el.innerHTML=(ic?'<div class="ic">'+ic+'</div>':'')+'<div class="tx">'+txt+'</div>';
  const cs=confs||['🎉','⭐','✨','💙','🏈'];for(let i=0;i<22;i++){const c=document.createElement('div');c.className='conf';c.textContent=cs[i%cs.length];c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),2300);}
  clearTimeout(fx.t);fx.t=setTimeout(()=>{el.className='';},1600);}
const parts=[];function burst(x,y,cols,n){for(let i=0;i<(n||12);i++){const a=Math.random()*Math.PI*2,s=120+Math.random()*220;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,t:.7,c:cols[i%cols.length]});}}
function drawParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t-=dt;if(p.t<=0){parts.splice(i,1);continue;}p.vy+=500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.fillStyle=p.c;ctx.fillRect(p.x-4,p.y-4,8,8);}}

function getRec(k){try{return parseInt(localStorage.getItem('werin_'+k))||0;}catch(e){return 0;}}
function setRec(k,v){try{localStorage.setItem('werin_'+k,String(v));}catch(e){}}
let T=0;
function hud(txt){ctx.font='24px "Press Start 2P",monospace';ctx.textBaseline='top';ctx.textAlign='right';ctx.lineWidth=6;ctx.strokeStyle='#fff';ctx.fillStyle='#1F4FA8';ctx.strokeText(txt,W-16,18);ctx.fillText(txt,W-16,18);}
function sky(top,bot){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,top||'#7CC8FF');g.addColorStop(1,bot||'#CFEFFF');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<4;i++){const cx=Math.round(((i*W*0.37+T*(10+i*4))%(W+180))-90),cy=50+i*48;ctx.fillRect(cx-40,cy-8,92,18);ctx.fillRect(cx-22,cy-22,52,14);}}
function city(baseY,scroll,col){ctx.fillStyle=col||'#9DB8D9';for(let i=0;i<Math.ceil(W/60)+3;i++){const bx=Math.round(((i*60-(scroll||0)*.3)%(W+120)+W+120)%(W+120)-60),bh=60+((i*37)%5)*28;ctx.fillRect(bx,baseY-bh,52,bh);
  ctx.fillStyle='rgba(255,255,255,.55)';for(let wy=baseY-bh+10;wy<baseY-12;wy+=18)for(let wx=bx+8;wx<bx+46;wx+=14)ctx.fillRect(wx,wy,7,9);ctx.fillStyle=col||'#9DB8D9';}}

/* ---------- 1. Touchdown ---------- */
function Touchdown(){
  const g={id:'td',name:'¡Touchdown!',score:0,over:false};
  const M=Math.min(W,H),ww=px16(Math.min(112,M*0.2)),wh=ww*SH/SW,G=H-Math.max(70,H*0.14),X=Math.max(80,W*0.24);
  let y=G,vy=0,onGround=true,spd=Math.max(170,W*0.28),dist=0,cones=[],nextCone=1.6,bump=0,td=null,party=0,goal=11,stars=[];
  const GRAV=2400,JUMP=-Math.sqrt(2*GRAV*Math.max(150,wh*1.25));
  say('¡Corre Werin! Toca la pantalla para brincar los conos y llega a la zona de anotación.');
  g.down=()=>{if(party>0)return;if(onGround){vy=JUMP;onGround=false;sweep(300,700,.18,'square',.07);}};
  g.update=dt=>{
    if(party>0){party-=dt;if(party<=0){if(g.score>=3){endGame(g);return;}goal=dist/spd+11;td=null;}return;}
    const s=bump>0?spd*.45:spd;bump=Math.max(0,bump-dt);dist+=s*dt;
    vy+=GRAV*dt;y+=vy*dt;if(y>=G){y=G;vy=0;onGround=true;}
    nextCone-=dt;const tGoal=goal-dist/spd;
    if(nextCone<=0&&tGoal>2.2&&!td){cones.push({x:W+40,hit:false});nextCone=1.5+Math.random()*1.3;if(Math.random()<.6)stars.push({x:W+40+s*.75,y:G-wh*1.5,got:false});}
    cones.forEach(c=>{c.x-=s*dt;const cw=Math.max(34,ww*.42);if(!c.hit&&Math.abs(c.x-X)<cw*.55+ww*.18&&y>G-cw*0.85){c.hit=true;bump=.6;beep(160,.15,'sawtooth',.06);}});
    cones=cones.filter(c=>c.x>-60);
    stars.forEach(st=>{st.x-=s*dt;if(!st.got&&Math.abs(st.x-X)<ww*.6&&Math.abs(st.y-(y-wh*.5))<wh*.7){st.got=true;beep(1320,.1,'square',.06);burst(st.x,st.y,['#FFD23F','#fff']);}});
    stars=stars.filter(s2=>s2.x>-40&&!s2.got);
    if(tGoal<=1.6&&!td)td={x:W+20};
    if(td){td.x-=s*dt;if(td.x<X-ww*0.2){g.score++;party=2.6;fanfare();say('¡Touchdown! ¡Bien hecho Werin!');fx('¡TOUCH<br>DOWN!','🏈');burst(X,y-wh,['#FFD23F','#E5484D','#2F6FE0','#fff'],30);}}
  };
  g.draw=()=>{
    sky();city(G-20,dist);

function Trepa(){
  const g={id:'trepa',name:'Súper trepa',score:0,over:false};
  const ww=px16(Math.min(96,Math.min(W,H)*.17)),wh=ww*SH/SW;

  say('¡Sube el edificio! Toca muchas veces para trepar y atrapa las estrellas.');
  function addStar(){next+=180+Math.random()*120;stars.push({h:next,side:Math.random()<.5?-1:1,got:false});}
  for(let i=0;i<6;i++)addStar();
  g.down=()=>{if(arrive>0)return;climb+=Math.max(70,H*.1);beep(500+((climb/40)%8)*60,.06,'square',.06);sway=1;};
  g.update=dt=>{time-=dt;if(time<=0){endGame(g);return;}
    if(arrive>0){arrive-=dt;return;}

    const tw=Math.min(W*.5,300);ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(W/2-tw/2,24,tw,14);ctx.fillStyle='#E8A23A';ctx.fillRect(W/2-tw/2,24,tw*Math.max(0,time)/45,14);

/* ---------- Varita mágica (mago original) ---------- */
const MAGIC_PAIRS=[['🐸','🦋'],['🥚','🐥'],['🎃','🍭'],['☁️','🌈'],['🪨','💎'],['🍂','🌸'],['🐛','🦋'],['🌑','🌟'],['🧦','🎁'],['🥕','🍰']];
function drawMago(c,x,y,w,drawFn,wave){

  c.fillStyle='#4B2C8F';c.beginPath();c.moveTo(x-w*.28,y-h*.46);c.lineTo(x+w*.28,y-h*.46);c.lineTo(x+w*.5,y-h*.06);c.lineTo(x-w*.5,y-h*.06);c.closePath();c.fill();

  c.fillStyle='#5B3FA6';c.beginPath();c.moveTo(x-hw*.36,hb);c.lineTo(x+hw*.36,hb);c.lineTo(x+hw*.12,hb-hh*.7);c.lineTo(x+hw*.28,hb-hh);c.lineTo(x-hw*.02,hb-hh*.72);c.closePath();c.fill();
  c.fillStyle='#3E2A7A';c.fillRect(x-hw*.55,hb-w*.02,hw*1.1,w*.1);

  const a=-0.9+(wave||0)*.5,hx=x+w*.4,hy=y-h*.42,L=w*.75,tx=hx+Math.cos(a)*L,ty=hy+Math.sin(a)*L;

}

  const sp=[];function sparks(x,y){for(let i=0;i<16;i++){const a=Math.random()*7,s=80+Math.random()*200;sp.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.8,c:['#FFD23F','#FFFFFF','#C9A7FF','#7CFFE0'][i%4]});}}
  g.update=dt=>{time-=dt;if(time<=0){endGame(g);return;}wave=Math.max(0,wave-dt*4);
    spawn-=dt;if(spawn<=0){const p=MAGIC_PAIRS[Math.floor(Math.random()*MAGIC_PAIRS.length)];items.push({a:p[0],b:p[1],x:X+ww+Math.random()*(W-X-ww-sz()),y:H+sz(),ph:Math.random()*6,v:cfg.speed*(0.8+Math.random()*.4)*Math.max(.8,H/700),done:0});spawn=cfg.every*(0.7+Math.random()*.6);}
    items.forEach(it=>{if(it.done){it.done+=dt;it.y-=dt*30;}else{it.y-=it.v*dt;it.x+=Math.sin(T*2+it.ph)*20*dt;}});

  g.draw=()=>{const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#1B1440');gr.addColorStop(1,'#4A2F86');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
    for(let i=0;i<40;i++){const sx=(i*137)%W,sy=(i*71)%(H*.8);ctx.globalAlpha=.4+.6*Math.abs(Math.sin(T*1.5+i));ctx.fillStyle='#fff';ctx.fillRect(sx,sy,3,3);}ctx.globalAlpha=1;
    ctx.fillStyle='#FFF4C2';ctx.beginPath();ctx.arc(W-90,90,42,0,7);ctx.fill();ctx.fillStyle='#1B1440';ctx.beginPath();ctx.arc(W-72,78,38,0,7);ctx.fill();
    ctx.fillStyle='#2A1B5C';ctx.fillRect(0,G,W,H-G);ctx.fillStyle='#3B2878';ctx.fillRect(0,G,W,5);
    items.forEach(it=>{const s=sz();if(it.done){ctx.globalAlpha=Math.max(0,1-(it.done-.9)*2);emo(ctx,it.b,it.x,it.y,s*(1+Math.min(.3,it.done)));ctx.globalAlpha=1;}
      else{ctx.globalAlpha=.25;ctx.fillStyle='#C9A7FF';ctx.beginPath();ctx.arc(it.x,it.y,s*.6,0,7);ctx.fill();ctx.globalAlpha=1;emo(ctx,it.a,it.x,it.y,s);}});
    tip=drawMago(ctx,X,G,ww,cfg.draw,wave);
    beams.forEach(b=>{ctx.globalAlpha=b.t/.35;ctx.strokeStyle='#FFF3A0';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(tip.tx,tip.ty);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;});
    sp.forEach(p=>{ctx.fillStyle=p.c;ctx.fillRect(p.x-3,p.y-3,6,6);});
    const tw=Math.min(W*.5,300);ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(W/2-tw/2,24,tw,12);ctx.fillStyle='#FFD23F';ctx.fillRect(W/2-tw/2,24,tw*Math.max(0,time)/45,12);
    cfg.hud(g.score);};
  return g;
}

/* ---------- control ---------- */
const MAKERS={td:Touchdown,robot:Robot,pum:Pum,trepa:Trepa,magia:()=>Magia({name:'Werin el Mago',speed:70,every:1.1,intro:'¡Eres Werin el Mago! Toca las cosas con tu varita para hacer magia.',say:say,draw:(c,x,y,w)=>drawWerin(c,x,y,w,0),hud:s=>hud('✨ '+s),cheer:s=>{fanfare();fx('¡'+s+'!','🪄',['✨','⭐','🌟','💜']);}})};
let game=null,lastId='td';
function hideAll(){['menu','over'].forEach(k=>$(k).classList.add('hide'));}
function start(id){lastId=id;unlockAudio();hideAll();$('back').classList.remove('hide');parts.length=0;playSong(id==='robot'?'robot':id==='magia'?'magia':'game');game=MAKERS[id]();}
function toMenu(){game=null;sayId++;try{speechSynthesis.cancel();}catch(e){}hideAll();$('back').classList.add('hide');refreshRecs();$('menu').classList.remove('hide');playSong('menu');}
function refreshRecs(){Object.keys(MAKERS).forEach(k=>$('r_'+k).textContent=getRec(k));}
function endGame(g){if(g.over)return;g.over=true;
  const prev=getRec(g.id);if(g.score>prev)setRec(g.id,g.score);
  $('o_game').textContent=g.name;$('o_score').textContent=g.score;$('o_rec').textContent=Math.max(prev,g.score);
  $('o_msg').textContent=g.score>prev&&g.score>0?'¡Nuevo récord! 🎉':'¡Súper Werin!';
  $('o_share').href='https://wa.me/?text='+encodeURIComponent('¡Werin hizo '+g.score+' en "'+g.name+'"! 🦸 '+location.href);
  $('o_again').onclick=()=>start(g.id);
  setTimeout(()=>{if(game===g){$('back').classList.add('hide');$('over').classList.remove('hide');drawMini('mini2',1);fanfare();say('¡Muy bien Werin! ¿Otra vez?');}},500);}

$('snd').textContent=soundOn?'🔊':'🔇';
$('snd').addEventListener('click',e=>{e.stopPropagation();ensureAC();setSound(!soundOn);if(soundOn&&!music.song)playSong(game?'game':'menu');});
$('back').addEventListener('click',e=>{e.stopPropagation();toMenu();});
let greeted=false;
['pointerdown','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,()=>{unlockAudio();if(AC&&!music.song)playSong(game?'game':'menu');
  if(!greeted&&!game){greeted=true;setTimeout(()=>{if(!game)say('¡Hola Werin! Toca un juego.');},150);}},{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&AC){try{AC.resume();}catch(e){}if(silentEl&&soundOn)silentEl.play().catch(()=>{});}});
cv.addEventListener('pointerdown',e=>{if(game&&!game.over)game.down(e.clientX,e.clientY);e.preventDefault();});
addEventListener('keydown',e=>{if(game&&!game.over&&(e.code==='Space'||e.code==='ArrowUp')){game.down(W/2,H/2);e.preventDefault();}});
async function checkUpdate(){try{const r=await fetch(location.pathname+'?t='+Date.now(),{cache:'no-store'});const t=await r.text();const m=t.match(/const VERSION='([^']+)'/);if(m&&m[1]!==VERSION&&!game)location.reload();}catch(e){}}
if(/^https?:/.test(location.protocol)&&!/claude|usercontent/.test(location.host))setTimeout(checkUpdate,1500);

drawMini('mini',0);refreshRecs();
let last=0,mt=0;
function loop(t){const dt=Math.min(0.033,(t-last)/1000||0);last=t;T+=dt;
  if(game){game.update(dt);if(game)game.draw();drawParts(dt);}
  else{sky();city(H,T*40);mt+=dt;if(mt>.25){mt=0;drawMini('mini',Math.floor(T*4)%2?1:2);}}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);

function setMagic(on){magicOn=on;try{localStorage.setItem('werin_magia',on?'1':'0');}catch(e){}$('mag').style.background=on?'#FFE27A':'rgba(255,255,255,.9)';$('mag').style.boxShadow=on?'0 0 0 3px #8E5CC9':'0 2px 6px rgba(0,0,0,.15)';const r=music.req;music.song=null;if(r)playSong(r);}
setMagic(magicOn);
$('mag').addEventListener('click',e=>{e.stopPropagation();unlockAudio();setMagic(!magicOn);if(!music.song)playSong(typeof game!=='undefined'&&game?'game':'menu');});
</script>
